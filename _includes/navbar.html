<header>
  <nav aria-label="main navigation" class="navbar is-fixed-top is-black is-size-5 has-text-weight-normal" id="navbar"
    role="navigation">
    <div class="navbar-brand">
      <p class="navbar-item">
        <a class="navbar-banner-link" href="/">
          <img class="navbar-banner" src="/assets/images/banner.svg">
        </a>
      </p>
      <a aria-expanded="false" aria-label="menu" class="navbar-burger has-text-info" data-target="navbarMenu"
        role="button">
        <span aria-hidden="true">
        </span>
        <span aria-hidden="true">
        </span>
        <span aria-hidden="true">
        </span>
        <span aria-hidden="true">
        </span>
      </a>
    </div>
    <div class="navbar-menu" id="navbarMenu">
      <div class="navbar-start">
        {% for item in site.data.socials %}
        <a class="navbar-item has-text-link" href="{{ item.link }}" target="_blank">
          <i class="fab {{ item.icon }}"></i>
        </a>
        {% endfor %}
      </div>
      <div class="navbar-end">
        {% for item in site.data.navigation %}
        <a href="{{ item.link }}" class="navbar-item has-text-{% if page.url==item.link %}primary" {% else %}link" {%
          endif %} rel="noopener">{{ item.name }}</a>
        {% endfor %}
      </div>
    </div>
  </nav>
</header>
